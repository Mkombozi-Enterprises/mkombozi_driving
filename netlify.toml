# Netlify Free tier — Next.js App Router
# Docs: https://docs.netlify.com/frameworks/next-js/overview/

[build]
  command = "npm run build"
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[build.environment]
  # Supabase JS 2.111+ expects Node 22+
  NODE_VERSION = "22"
  NODE_OPTIONS = "--max-old-space-size=4096"
  # Config keys whose *values* appear legitimately in docs/code (not secret material).
  # Real secrets (SUPABASE_SECRET_KEY, CMS_SECRET, ADMIN_PASSWORD) must never appear in the repo.
  SECRETS_SCAN_OMIT_KEYS = "CMS_BACKEND,SUPABASE_URL,SUPABASE_JWKS_URL,SUPABASE_PUBLISHABLE_KEY"

# ── Set these in Netlify UI (never commit secrets) ──
# CMS_BACKEND          = supabase | file
# SUPABASE_URL
# SUPABASE_PUBLISHABLE_KEY
# SUPABASE_SECRET_KEY
# SUPABASE_JWKS_URL
# ADMIN_PASSWORD       (min 8 chars; unique — do not use documented examples)
# CMS_SECRET           (long random string)

[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

[[headers]]
  for = "/documents/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
